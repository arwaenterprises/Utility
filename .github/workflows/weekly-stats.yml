name: Weekly usage report

# Emails the platform owner a usage report every Monday 08:00 Riyadh time (05:00 UTC):
# who did how much last week (boxes closed, items scanned, labels printed, lookups, pallet scans).
# Setup (one time, ~5 minutes): stats/README.md
#
# NOTE: GitHub only runs *scheduled* workflows from the repository's DEFAULT branch. If this file
# is not on the default branch the Monday email will not be sent - see stats/README.md, "Why no email?".
# "Run workflow" (manual) works from the Actions tab at any time.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: print the report in the log, do not send the email'
        type: boolean
        default: false

jobs:
  report:
    name: Build and email the report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: saas-pilot          # the report code lives on the saas-pilot branch
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Send the report
        run: node stats/weekly-report.js ${{ inputs.dry_run && '--dry' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
