[build]
  publish = "Utility App"
  command = ""

# ---------------------------------------------------------------------------
# Security headers (every page)
# ---------------------------------------------------------------------------
# Enforced now - safe for this app:
#   X-Frame-Options / frame-ancestors  : nobody else can embed the app in a frame (clickjacking)
#   X-Content-Type-Options             : browsers must not guess file types
#   Referrer-Policy                    : do not leak full URLs to other sites
#   Permissions-Policy                 : camera only for this site (barcode scanner); no microphone, location, payment
#
# Content-Security-Policy is sent in REPORT-ONLY mode first: it never blocks anything,
# it only logs violations in the browser console (F12 -> Console). After the app has been
# used on every device for a day with no "Content Security Policy" warnings, rename the
# header below from Content-Security-Policy-Report-Only to Content-Security-Policy to
# start enforcing it. Any new CDN / API host the app starts using must be added here.
#
# script-src keeps 'unsafe-inline' because index.html uses inline onclick="..." handlers
# and a small inline <script>; the policy still blocks scripts from any host not listed.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.sheetjs.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' https://pacqjqjigmepkycfjapa.supabase.co wss://pacqjqjigmepkycfjapa.supabase.co; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# The manifest must be served as a web manifest (Netlify's default for .webmanifest is a generic type).
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
