[build]
  publish = "Utility App"
  command = ""

# ---------------------------------------------------------------------------
# Security headers (every page)
# ---------------------------------------------------------------------------
# Enforced now - safe for this app:
#   X-Frame-Options / frame-ancestors  : nobody else can embed the app in a frame (clickjacking)
#   X-Content-Type-Options             : browsers must not guess file types
#   Referrer-Policy                    : do not leak full URLs to other sites
#   Permissions-Policy                 : camera only for this site (barcode scanner); no microphone, location, payment
#
# Content-Security-Policy is ENFORCED: scripts may only come from this site (all libraries are
# self-hosted in "Utility App/vendor/", so no external script host is allowed at all), and
# connections only go to this site and the Supabase project. Any new API host must be added here.
#
# script-src keeps 'unsafe-inline' because index.html uses inline onclick="..." handlers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' https://pacqjqjigmepkycfjapa.supabase.co wss://pacqjqjigmepkycfjapa.supabase.co; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# The manifest must be served as a web manifest (Netlify's default for .webmanifest is a generic type).
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
